# The room broker. See README.md for what it does and why it is a Durable
# Object rather than KV.
name = "rsc-rooms"
main = "src/index.ts"
compatibility_date = "2026-01-01"

[durable_objects]
bindings = [
  { name = "ROOMS", class_name = "Rooms" },
  { name = "BOARDS", class_name = "Boards" },
]

# `new_sqlite_classes`, and not by choice: the free plan refuses a Durable Object
# namespace created any other way ("you must create a namespace using a
# `new_sqlite_classes` migration", API error 10097). This said `new_classes`
# first, reasoning that rooms are sixty seconds of in-memory state that is never
# written down so there is no storage backend to pick.
#
# That reasoning was wrong, and the storage this provisions is now what the
# rooms actually run on: a Durable Object is evicted when it goes idle and
# rebuilt on the next request, so a handshake that spans four requests cannot
# keep anything in a field. See the header of `src/rooms.ts` — the symptom was
# a guest waiting forever for a host that never saw its reply.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Rooms"]

# The leaderboard. `new_sqlite_classes` again, and this time the SQLite backing
# is actually used for what it is: unlike a room, a board is meant to outlive
# everything — the object, the deploy, and the players who set the times.
[[migrations]]
tag = "v2"
new_sqlite_classes = ["Boards"]
