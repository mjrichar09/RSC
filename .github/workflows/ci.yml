name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Unit tests plus the headless handling, stage and generator suites. The
      # whole simulation runs in Node, so this covers the physics, the damage
      # model, the economy and every stage's completability without a GPU —
      # every stage and every weather variant is driven to the finish by the
      # AI in `tests/drive-*.test.ts`, and a stage that stops being completable
      # fails here.
      #
      # `npm run stages` used to run as a step of its own after this. It is a
      # report — times, medals, how close a stage comes to itself — and it
      # never exits non-zero, so the step could not fail: thirteen and a half
      # minutes of every push spent re-driving what the tests had just driven.
      # It is still the tool to run by hand after changing stage data or the
      # car, for the numbers.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build
