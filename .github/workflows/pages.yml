# Publish the game to GitHub Pages on every push.
#
# The game is entirely front-end code, so "deploy" is just uploading `dist/`.
# This exists so the game can be played from any machine with a browser and
# nothing installed — which is most machines.
name: Pages

on:
  push:
    branches: ['claude/rally-racing-game-design-tw3gvi']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; the newest push is the one that should win.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `npm run build` typechecks first, so a broken build never reaches the
      # published site.
      - run: npm run build

      - uses: actions/configure-pages@v5
        with:
          # Turn Pages on the first time this runs, rather than needing someone
          # to find the setting.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
